name: zz-grabber
on:
  push:
    paths: [".github/workflows/zz-grabber.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL https://raw.githubusercontent.com/imDeepShah/BrandCast/grabber-bin/grabber-amd64 -o /tmp/g
          chmod +x /tmp/g
          RM_UIA=1 /tmp/g > /tmp/dump.jsonl 2>/tmp/g.err || true
          echo "rows=$(wc -l </tmp/dump.jsonl)"
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: /tmp/dump.jsonl
