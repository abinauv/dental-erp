name: Release

# Publishes a multi-architecture image to GHCR when a version tag is pushed:
#
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# It can also be run by hand from the Actions tab, which builds both
# architectures and publishes nothing. That exists so the workflow can be proven
# before the first real tag, rather than discovering a typo in it while trying
# to cut a release.
#
# Publishing is tied to a tag push and nothing else — deliberately, with no
# "publish anyway" switch. Without a version tag there is no version to publish
# under, so a manual run that pushed would either need a made-up tag or would
# leave untagged digests in the registry that nothing references.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # abinauv/dental-erp — already lowercase, which GHCR requires.
  IMAGE_NAME: ${{ github.repository }}
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  # The same lint, type check, unit tests and build that gate a pull request,
  # called rather than copied. A tag can be cut from any commit, and an image
  # published to a public registry for a system holding patient records should
  # not be the first place those checks are skipped.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # A native arm64 runner, not QEMU. Emulating a Next.js production
          # build is slow enough to push the job past its timeout, and has a
          # habit of running the emulated process out of memory. If this label
          # is ever unavailable, the fallback is a single job with
          # docker/setup-qemu-action and both platforms passed at once — same
          # result, considerably more patience required.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform for cache and artifact keys
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest with no tag of its own. Tagging
      # here would mean the second job to finish overwrites the first, leaving a
      # single-architecture image under a name that claims to be both. The tags
      # are attached once, to the manifest list, in the job below.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Off because the digest handed to `imagetools create` below must be
          # the image manifest itself. With provenance on, buildx returns an
          # index wrapping image + attestation, and merging those produces a
          # manifest list that some runtimes will not pull.
          provenance: false

      - name: Export the digest
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: build
    if: needs.build.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=DentalERP
            org.opencontainers.image.description=Open-source dental clinic management system

      # `latest` deliberately excludes pre-releases: v1.2.0-rc.1 carries the
      # version tags but must not become what a fresh `docker compose up` pulls.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Confirm both architectures are in the published image
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
            | sort > /tmp/published-platforms
          cat /tmp/published-platforms
          # A release that quietly went single-architecture is worse than one
          # that failed, because nothing tells the arm64 operator until they try.
          grep -qx 'linux/amd64' /tmp/published-platforms
          grep -qx 'linux/arm64' /tmp/published-platforms
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${DOCKER_METADATA_OUTPUT_JSON}" | jq -r '.tags[]'
            echo '```'
            echo ''
            echo "Architectures: $(paste -sd', ' /tmp/published-platforms)"
          } >> "$GITHUB_STEP_SUMMARY"
