name: E2E Tests

# The full Playwright suite on every pull request, nightly, and on demand. A run
# takes about six minutes, in parallel with CI.
#
# It runs on pull requests because the nightly run alone let a break sit for
# twelve days: the sign-in rate limit made almost every spec fail at login from
# 2026-11-05, and nothing on the PR that added it showed that. Every test is now
# its own client to the app's per-IP rate limits (tests/e2e/fixtures/auth.ts).
#
# Like ci.yml, deliberately unfiltered by branch or path, so that it can be made
# a required check: a required check that is skipped never reports.
on:
  pull_request:
  # Nightly on main as well, for what changes without a pull request: the
  # Playwright browser, the MySQL service image, the time of day.
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (Playwright --grep)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Backstop for the 6h job ceiling; playwright globalTimeout trips first.
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The migrations, as a real install runs them, rather than `db push`:
      # this also checks that they build the current schema from nothing.
      - name: Migrate test DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'

      # The e2e fixtures in tests/e2e/fixtures/auth.ts log in as the users this
      # seed creates. Keep the two in sync or every authenticated spec fails at
      # fixture setup.
      - name: Seed test data
        run: npx prisma db seed
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'

      # playwright.config.ts starts `npm run start` in CI, which needs a build.
      # A dev server recompiles each route on first request and blew the
      # per-test timeout repeatedly.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'
          NEXTAUTH_SECRET: 'ci-test-secret-at-least-32-chars-long'
          NEXTAUTH_URL: 'http://localhost:3000'

      # Only chromium — playwright.config.ts narrows the project matrix in CI.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'
          NEXTAUTH_SECRET: 'ci-test-secret-at-least-32-chars-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          CRON_SECRET: 'ci-cron-secret'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
