name: E2E Tests

# The Playwright suite is not a push gate yet: a large share of its specs assert
# on UI affordances the app never had (ambiguous `.or()` locators that trip
# Playwright strict mode, headings by the wrong name), so it has never been
# green. It runs nightly and on demand while those specs are repaired — see the
# E2E tracking issue. Once the suite is green, fold this job back into ci.yml.
on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (Playwright --grep)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Backstop for the 6h job ceiling; playwright globalTimeout trips first.
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'

      # The e2e fixtures in tests/e2e/fixtures/auth.ts log in as the users this
      # seed creates. Keep the two in sync or every authenticated spec fails at
      # fixture setup.
      - name: Seed test data
        run: npx prisma db seed
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'

      # playwright.config.ts starts `npm run start` in CI, which needs a build.
      # A dev server recompiles each route on first request and blew the
      # per-test timeout repeatedly.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'
          NEXTAUTH_SECRET: 'ci-test-secret-at-least-32-chars-long'
          NEXTAUTH_URL: 'http://localhost:3000'

      # Only chromium — playwright.config.ts narrows the project matrix in CI.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
        env:
          DATABASE_URL: 'mysql://test:test@localhost:3306/dental_test'
          NEXTAUTH_SECRET: 'ci-test-secret-at-least-32-chars-long'
          NEXTAUTH_URL: 'http://localhost:3000'
          CRON_SECRET: 'ci-cron-secret'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
